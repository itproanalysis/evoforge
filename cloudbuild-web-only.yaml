# Simplified build config for web deployment only
substitutions:
  _REGION: asia-northeast3
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Build web image
  - name: gcr.io/cloud-builders/docker
    id: build-web
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_BASE=
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/web:${_TAG}
      - apps/web
  
  # Push web image
  - name: gcr.io/cloud-builders/docker
    id: push-web
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/web:${_TAG}
  
  # Deploy to Cloud Run
  - name: gcr.io/cloud-builders/gcloud
    id: deploy-web
    args:
      - run
      - deploy
      - evoforge-web
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/web:${_TAG}
      - --platform=managed
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/web:${_TAG}
