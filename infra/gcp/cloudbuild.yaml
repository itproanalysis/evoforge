# EvoForge CI/CD -- API context: repo root; web context: apps/web.
# Substitutions: _PROJECT (required), _REGION (default asia-northeast3).
# Images tagged :$COMMIT_SHA + :latest.
# NOTE: keep every declared key referenced in steps below; Cloud Build
# rejects unused substitution defaults ("not matched in the template").
substitutions:
  _REGION: asia-northeast3

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 0) Schemas, reference tests and SQL contracts in an isolated PostgreSQL 15 cluster.
  - name: python:3.12-slim-bookworm
    id: validate
    entrypoint: bash
    args:
      - infra/ci/validate_contracts.sh

  # 1) API unit tests (git CLI required by runner/sandbox tests).
  - name: python:3.12-slim
    id: pytest
    entrypoint: bash
    args:
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq git > /dev/null &&
        pip install -q -r services/api/requirements.txt &&
        python -m pytest services/api -q

  # 2) Build + push images to Artifact Registry.
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - -f
      - services/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/api:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/api:latest
      - .
  - name: gcr.io/cloud-builders/docker
    id: build-web
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_BASE=
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/web:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/web:latest
      - apps/web
  - name: gcr.io/cloud-builders/docker
    id: push
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/api:$COMMIT_SHA &&
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/api:latest &&
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/web:$COMMIT_SHA &&
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/web:latest

  # 3) SQL migrations: schema is now provisioned out-of-band
  # (infra/gcp/migrate_once.py, ops.applied_files-tracked) against the live
  # instance. The in-build psql path stays a green skip until terraform owns
  # state + imports; running core_DRAFT.sql verbatim twice would fail on
  # existing tables (by contract design: no IF NOT EXISTS on core tables).
  - name: gcr.io/cloud-builders/gcloud
    id: migrate
    entrypoint: bash
    args:
      - -c
      - |
        echo "SKIP migrate: schema managed out-of-band (see infra/gcp/migrate_once.py)"
    secretEnv: []

  # Deploy fresh digests directly (keeps existing env/secrets/IAM).
  # Full terraform converge stays out of the critical path until state +
  # imports for the hand-built resources exist (see infra/gcp/).
  - name: gcr.io/cloud-builders/gcloud
    id: deploy-api
    args:
      - run
      - deploy
      - evoforge-api
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/api:$COMMIT_SHA
  - name: gcr.io/cloud-builders/gcloud
    id: deploy-web
    args:
      - run
      - deploy
      - evoforge-web
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/web:$COMMIT_SHA

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/api:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/evoforge/web:$COMMIT_SHA
